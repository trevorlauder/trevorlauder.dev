name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24.10.0"
      - run: npm ci
      - uses: pre-commit/action@v3.0.1
