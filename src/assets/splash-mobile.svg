<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Aurora wave banner mobile">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>

    <!-- Soft aurora glows -->
    <radialGradient id="glowLeft" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#18FFC5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#18FFC5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave fills and strokes -->
    <linearGradient id="waveFill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7F7FD5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7F7FD5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E0FF"/>
      <stop offset="50%" stop-color="#7F7FD5"/>
      <stop offset="100%" stop-color="#00E0FF"/>
    </linearGradient>

    <!-- Subtle glow for lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="250" fill="url(#bgGrad)"/>

  <!-- Auroral glows -->
  <g>
    <rect x="0" y="0" width="300" height="400" fill="url(#glowLeft)"/>
    <rect x="300" y="200" width="300" height="300" fill="url(#glowRight)"/>
  </g>

  <!-- Starscape -->
  <g fill="#FFFFFF">
    <g opacity="0.65">
      <circle cx="60" cy="90" r="1.4"/>
      <circle cx="130" cy="60" r="1.2"/>
      <circle cx="205" cy="130" r="1.7"/>
      <circle cx="270" cy="40" r="1.1"/>
      <circle cx="350" cy="110" r="1.5"/>
      <circle cx="430" cy="70" r="1.2"/>
      <circle cx="490" cy="150" r="1.6"/>
      <circle cx="550" cy="50" r="1.1"/>
    </g>
    <g opacity="0.35">
      <circle cx="90" cy="180" r="1.0"/>
      <circle cx="175" cy="200" r="0.9"/>
      <circle cx="260" cy="170" r="1.1"/>
      <circle cx="380" cy="190" r="0.9"/>
      <circle cx="470" cy="175" r="1.0"/>
      <circle cx="560" cy="200" r="1.1"/>
    </g>
  </g>

  <!-- A subtle constellation line -->
  <g stroke="url(#waveStroke)" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
    <polyline points="110 140 210 95 340 125 455 85 600 120" fill="none" filter="url(#glow)"/>
    <g fill="#9EEAF9" opacity="0.9">
      <circle cx="110" cy="140" r="2"/>
      <circle cx="210" cy="95" r="2"/>
      <circle cx="340" cy="125" r="2"/>
      <circle cx="455" cy="85" r="2"/>
      <circle cx="600" cy="120" r="2"/>
    </g>
  </g>

  <!-- Layered aurora-like waves -->
  <g>
    <path d="M0,180 C150,155 300,205 450,180 S600,155 600,180 L600,250 L0,250 Z" fill="url(#waveFill1)"/>
    <path d="M0,200 C140,180 310,220 470,200 S600,180 600,200 L600,250 L0,250 Z" fill="url(#waveFill2)"/>
    <path d="M0,220 C130,200 320,240 490,220 S600,200 600,220" fill="none" stroke="url(#waveStroke)" stroke-width="2.5" opacity="0.65" filter="url(#glow)"/>
  </g>

  <!-- Bottom vignette for focus -->
  <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </linearGradient>
  <rect x="0" y="150" width="600" height="100" fill="url(#vignette)"/>
</svg>
